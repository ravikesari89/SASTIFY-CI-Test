name: SASTIFY Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sastify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Validate GitHub CI metadata
        shell: powershell
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shortSha = if ($env:COMMIT_SHA) { $env:COMMIT_SHA.Substring(0, [Math]::Min(12, $env:COMMIT_SHA.Length)) } else { '<empty>' }
          Write-Host "GitHub metadata: repository=[$($env:REPOSITORY_NAME)] event=[$($env:CI_EVENT_NAME)] actor=[$($env:ACTOR)] commit=[$shortSha] workflow=[$($env:WORKFLOW_NAME)]"
          if ([string]::IsNullOrWhiteSpace($env:CI_EVENT_NAME) -or
              [string]::IsNullOrWhiteSpace($env:COMMIT_SHA) -or
              [string]::IsNullOrWhiteSpace($env:ACTOR)) {
            throw 'GitHub Actions did not provide one or more required CI metadata values. No scan was submitted.'
          }

      - name: Trigger SASTIFY scan and enforce security gate
        shell: powershell
        env:
          SASTIFY_URL: http://localhost:5000
          SASTIFY_TOKEN: ${{ secrets.SASTIFY_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          PROJECT_NAME: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PROVIDER: github
          REPO_USERNAME: x-access-token
          REPO_TOKEN: ${{ github.token }}
          BLOCK_AT: HIGH
          SCAN_SCOPE: sast
          DETECTION_ENGINE: both
          RUN_SCA: 'false'
          USE_NVD: 'false'
          RETAIN_SOURCE: 'true'
          CI_EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ''
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          try {
            if ([string]::IsNullOrWhiteSpace($env:SASTIFY_TOKEN)) {
              throw 'GitHub secret SASTIFY_TOKEN is not configured.'
            }
            if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_URL)) {
              throw 'REPOSITORY_URL is empty.'
            }

            $eventName = $env:CI_EVENT_NAME.Trim()
            $commitSha = $env:COMMIT_SHA.Trim()
            $actor = $env:ACTOR.Trim()
            $workflowName = $env:WORKFLOW_NAME.Trim()
            $sourceBranch = $env:SOURCE_BRANCH.Trim()
            $targetBranch = $env:TARGET_BRANCH.Trim()

            if ([string]::IsNullOrWhiteSpace($eventName) -or
                [string]::IsNullOrWhiteSpace($commitSha) -or
                [string]::IsNullOrWhiteSpace($actor)) {
              throw 'Required GitHub metadata is empty. Scan was not submitted.'
            }

            $baseUrl = $env:SASTIFY_URL.TrimEnd('/')
            $headers = @{ Authorization = "Bearer $($env:SASTIFY_TOKEN)" }
            $runSca = [System.Convert]::ToBoolean($env:RUN_SCA)
            $useNvd = [System.Convert]::ToBoolean($env:USE_NVD)
            $retainSource = [System.Convert]::ToBoolean($env:RETAIN_SOURCE)
            $prNumber = $null
            if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
              $prNumber = [int]$env:PR_NUMBER
            }

            $payload = [ordered]@{
              project = $env:PROJECT_NAME
              repository_url = $env:REPOSITORY_URL
              branch = $env:BRANCH
              provider = $env:PROVIDER
