
name: SASTIFY V60 Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sastify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit SASTIFY scan and enforce security gate
        shell: powershell
        env:
          SASTIFY_URL: ${{ secrets.SASTIFY_URL }}
          SASTIFY_TOKEN: ${{ secrets.SASTIFY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
          CI_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CI_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_EVENT: ${{ github.event_name }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_ACTOR: ${{ github.actor }}
          CI_WORKFLOW: ${{ github.workflow }}
        run: |
          $ErrorActionPreference = "Stop"

          try {
              if ([string]::IsNullOrWhiteSpace($env:SASTIFY_URL)) {
                  throw "SASTIFY_URL secret is missing."
              }

              if ([string]::IsNullOrWhiteSpace($env:SASTIFY_TOKEN)) {
                  throw "SASTIFY_TOKEN secret is missing."
              }

              $baseUrl = $env:SASTIFY_URL.TrimEnd("/")
              $headers = @{
                  Authorization = "Bearer $env:SASTIFY_TOKEN"
              }

              Write-Host "Checking SASTIFY V60 connectivity..."

              $health = Invoke-WebRequest `
                  -Uri $baseUrl `
                  -UseBasicParsing `
                  -TimeoutSec 30

              if ($health.StatusCode -ne 200) {
                  throw "SASTIFY application is not healthy."
              }

              Write-Host "SASTIFY V60 is reachable."

              $prNumber = $null
              if ($env:CI_PR_NUMBER -match '^\d+$') {
                  $prNumber = [int]$env:CI_PR_NUMBER
              }

              $payload = @{
                  project          = "${{ github.repository }}"
                  repository_url   = $env:REPOSITORY_URL
                  branch           = $env:CI_BRANCH
                  provider         = "github"
                  scope            = "sast"
                  detection_engine = "both"
                  run_sca          = $false
                  use_nvd          = $false
                  retain_source    = $true
                  block_at         = "HIGH"
                  repo_username    = "x-access-token"
                  repo_token       = $env:GITHUB_TOKEN
                  event_name       = $env:CI_EVENT
                  commit_sha       = $env:CI_COMMIT_SHA
                  pr_number        = $prNumber
                  actor            = $env:CI_ACTOR
                  workflow_name    = $env:CI_WORKFLOW
                  source_branch    = $env:CI_SOURCE_BRANCH
                  target_branch    = $env:CI_TARGET_BRANCH
              }

              $body = $payload | ConvertTo-Json -Depth 10

              Write-Host "Submitting SASTIFY scan..."
              Write-Host "Repository: $env:REPOSITORY_URL"
              Write-Host "Branch: $env:CI_BRANCH"
              Write-Host "Detection engines: Custom Engine + Semgrep"
              Write-Host "Blocking threshold: HIGH"

              $scan = Invoke-RestMethod `
                  -Uri "$baseUrl/api/ci/v1/scans" `
                  -Method POST `
                  -Headers $headers `
                  -ContentType "application/json" `
                  -Body $body `
                  -TimeoutSec 120

              $scanId = $scan.scan_id
              if ([string]::IsNullOrWhiteSpace("$scanId")) {
                  $scanId = $scan.id
              }

              if ([string]::IsNullOrWhiteSpace("$scanId")) {
                  throw "Scan submission did not return a scan ID."
              }

              Write-Host "Scan submitted successfully. Scan ID: $scanId"

              $completed = $false

              for ($i = 1; $i -le 90; $i++) {
                  Start-Sleep -Seconds 20

                  $status = Invoke-RestMethod `
                      -Uri "$baseUrl/api/ci/v1/scans/$scanId" `
                      -Method GET `
                      -Headers $headers `
                      -TimeoutSec 60

                  Write-Host "Scan status: $($status.status)"

                  if ($status.status -in @("done", "completed")) {
                      $completed = $true
                      break
                  }

                  if ($status.status -in @("failed", "error")) {
                      throw "SASTIFY scan failed. Check the SASTIFY application logs."
                  }
              }

              if (-not $completed) {
                  throw "Scan timed out after 30 minutes."
              }

              Write-Host "Scan completed. Checking security gate..."

              $gate = Invoke-RestMethod `
                  -Uri "$baseUrl/api/ci/v1/scans/$scanId/gate?block_at=HIGH" `
                  -Method GET `
                  -Headers $headers `
                  -TimeoutSec 60

              $gateResult = "$($gate.gate)".ToUpper()

              if ([string]::IsNullOrWhiteSpace($gateResult)) {
                  $gateResult = "$($gate.result)".ToUpper()
              }

              if ([string]::IsNullOrWhiteSpace($gateResult)) {
                  $gateResult = "$($gate.status)".ToUpper()
              }

              Write-Host "Security gate result: $gateResult"
              Write-Host "Blocking findings: $($gate.blocking_findings)"

              if ($gateResult -eq "FAIL") {
                  Write-Error "SASTIFY SECURITY GATE FAILED. Blocking the GitHub workflow."
                  exit 1
              }

              if ($gateResult -ne "PASS") {
                  throw "Unknown security gate response. Failing closed."
              }

              Write-Host "SASTIFY SECURITY GATE PASSED."
              exit 0
          }
          catch {
              Write-Host "SASTIFY CI/CD ERROR: $($_.Exception.Message)"
              exit 1
          }
