
name: SASTIFY V60 Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sastify:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SASTIFY V60
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:5000" -UseBasicParsing
            Write-Host "SASTIFY V60 is reachable. HTTP Status: $($response.StatusCode)"
          }
          catch {
            Write-Host "SASTIFY V60 connectivity failed: $($_.Exception.Message)"
            exit 1
          }
