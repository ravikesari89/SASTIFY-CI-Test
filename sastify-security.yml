RETAIN_SOURCE: 'true'
          CI_EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ''
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          try {
            foreach ($name in @('SASTIFY_TOKEN', 'REPOSITORY_URL', 'PROJECT_NAME', 'BRANCH', 'CI_EVENT_NAME', 'COMMIT_SHA', 'ACTOR')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ([string]::IsNullOrWhiteSpace($value)) {
                throw "Required environment variable '$name' is empty. No scan was submitted."
              }
            }

            if ($env:COMMIT_SHA -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'COMMIT_SHA must be a full 40-character hexadecimal Git commit ID.'
            }

            $baseUrl = $env:SASTIFY_URL.TrimEnd('/')
            $headers = @{ Authorization = "Bearer $($env:SASTIFY_TOKEN)" }
            $prNumber = $null
            if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
              $parsedPrNumber = 0
              if (-not [int]::TryParse($env:PR_NUMBER, [ref]$parsedPrNumber) -or $parsedPrNumber -lt 1) {
                throw 'PR_NUMBER must be empty or a positive integer.'
              }
              $prNumber = $parsedPrNumber
            }

            # These property names intentionally match app.py:ci_create_scan().
            $payload = [ordered]@{
              project          = $env:PROJECT_NAME
              repository_url   = $env:REPOSITORY_URL
              branch           = $env:BRANCH
              provider         = $env:PROVIDER
              scope            = $env:SCAN_SCOPE
              detection_engine = $env:DETECTION_ENGINE
              run_sca          = [System.Convert]::ToBoolean($env:RUN_SCA)
              use_nvd          = [System.Convert]::ToBoolean($env:USE_NVD)
              retain_source    = [System.Convert]::ToBoolean($env:RETAIN_SOURCE)
              repo_username    = $env:REPO_USERNAME
              repo_token       = $env:REPO_TOKEN
              block_at         = $env:BLOCK_AT
              event_name       = $env:CI_EVENT_NAME
              commit_sha       = $env:COMMIT_SHA
              pr_number        = $prNumber
              actor            = $env:ACTOR
              workflow_name    = $env:WORKFLOW_NAME
              source_branch    = $env:SOURCE_BRANCH
              target_branch    = $env:TARGET_BRANCH
            }

            $jsonBody = $payload | ConvertTo-Json -Depth 8
            Write-Host 'Submitting repository scan to SASTIFY...'
            Write-Host "Metadata being submitted: event=[$($payload.event_name)] actor=[$($payload.actor)] commit=[$($payload.commit_sha.Substring(0,12))] workflow=[$($payload.workflow_name)] source_branch=[$($payload.source_branch)] target_branch=[$($payload.target_branch)]"

            $scanResponse = Invoke-RestMethod -Method Post `
              -Uri "$baseUrl/api/ci/v1/scans" `
              -Headers $headers `
              -ContentType 'application/json; charset=utf-8' `
              -Body $jsonBody `
              -TimeoutSec 60

            $scanId = [string]$scanResponse.scan_id
            if ([string]::IsNullOrWhiteSpace($scanId)) {
              throw 'SASTIFY accepted the request but did not return a scan_id.'
            }

            Write-Host "SASTIFY scan ID: $scanId"
            $maxAttempts = 180
            $pollSeconds = 10
            $status = $null

            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              $status = Invoke-RestMethod -Method Get `
                -Uri "$baseUrl/api/ci/v1/scans/$scanId" `
                -Headers $headers `
                -TimeoutSec 30

              $state = [string]$status.status
              Write-Host "SASTIFY status: $state (attempt $attempt/$maxAttempts)"

              if ($state -eq 'done') {
                break
              }
              if ($state -in @('error', 'cancelled')) {
                throw "SASTIFY scan ended with status '$state'. Message: $($status.message)"
              }

              Start-Sleep -Seconds $pollSeconds
            }

            if ($null -eq $status -or [string]$status.status -ne 'done') {
              throw "Timed out waiting for SASTIFY scan $scanId."
            }

            $gateUri = "$baseUrl/api/ci/v1/scans/$scanId/gate?block_at=$([Uri]::EscapeDataString($env:BLOCK_AT))"
            $gate = Invoke-RestMethod -Method Get -Uri $gateUri -Headers $headers -TimeoutSec 30

            Write-Host 'SASTIFY security gate response:'
            Write-Host ($gate | ConvertTo-Json -Depth 8)

            if ([string]$gate.gate -notin @('PASS', 'FAIL')) {
              throw "SASTIFY returned an unexpected security gate value: '$($gate.gate)'"
            }

            if ([string]$gate.gate -eq 'FAIL') {
              Write-Host 'SASTIFY security gate FAILED. Blocking findings were detected.' -ForegroundColor Red
              exit 1
            }

            Write-Host 'SASTIFY security gate PASSED.' -ForegroundColor Green
            exit 0
          }
          catch {
            Write-Host "SASTIFY CI error: $($_.Exception.Message)" -ForegroundColor Red
            exit 2
          }
